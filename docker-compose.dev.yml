services:

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: dotnet_app
    ports:
      - "8080:8080"
    volumes:
      - ./src/MyApp.API:/app
      - ~/.nuget/packages:/root/.nuget/packages
      - /app/bin
      - /app/obj
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: server=db;port=3306;database=myapp;user=root;password=root
      Jwt__Key: ${JWT_KEY}
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      DOTNET_EnableDiagnostics: "1"
      NO_HOT_RELOAD: "${NO_HOT_RELOAD:-false}"   # ← Mặc định false
    stdin_open: true
    tty: true
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: mysql_db
    restart: always
    command: --skip-name-resolve
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: myapp
      MYSQL_USER: myuser
      MYSQL_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: